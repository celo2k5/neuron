# NEURON local stack. NOTE: written for parity with infra/localnet.sh, which is the path verified in CI-like runs.
# This compose file was not executed in the build environment (no Docker daemon); see README "Verification".
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: neuron, POSTGRES_PASSWORD: neuron, POSTGRES_DB: neuron }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U neuron"], interval: 3s, retries: 20 }
  web:
    build: { context: ., dockerfile: infra/app.Dockerfile }
    command: sh -c "npx tsx apps/web/scripts/migrate.ts && npm run start -w @neuron/web"
    env_file: [.env]
    environment: { DATABASE_URL: postgres://neuron:neuron@postgres:5432/neuron }
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: infra/app.Dockerfile }
    command: npm run worker -w @neuron/web
    env_file: [.env]
    environment: { DATABASE_URL: postgres://neuron:neuron@postgres:5432/neuron }
    depends_on: { web: { condition: service_started } }
volumes: { pgdata: {} }
