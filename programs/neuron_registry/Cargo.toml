[package]
name = "neuron_registry"
version = "0.1.0"
edition = "2021"
description = "NEURON experiment commitment registry"

[lib]
crate-type = ["cdylib", "lib"]
name = "neuron_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "=0.32.1"

[lints.rust]
unexpected_cfgs = { level = "allow" }
